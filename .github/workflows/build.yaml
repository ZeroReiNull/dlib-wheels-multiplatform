
name: Build dlib Wheels

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Official dlib tag"
        required: true
        default: "v20.0.1"
        type: string

permissions:
  contents: read

env:
  DLIB_VERSION: ${{ inputs.version }}

jobs:
  build:
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: manylinux_x86_64
            os: ubuntu-latest
            arch: x86_64

          - platform: manylinux_aarch64
            os: ubuntu-24.04-arm
            arch: aarch64

          - platform: musllinux_x86_64
            os: ubuntu-latest
            arch: x86_64

          - platform: musllinux_aarch64
            os: ubuntu-24.04-arm
            arch: aarch64

          - platform: macosx_arm64
            os: macos-14
            arch: arm64

          - platform: win_amd64
            os: windows-latest
            arch: AMD64

          - platform: win_arm64
            os: windows-latest
            arch: ARM64

    steps:
      - name: Checkout dlib
        uses: actions/checkout@v4
        with:
          repository: davisking/dlib
          ref: ${{ env.DLIB_VERSION }}
          path: dlib
          persist-credentials: false

      - name: Configure build
        shell: bash
        working-directory: dlib
        run: |
          python - <<'PY'
          from pathlib import Path

          setup = Path("setup.py")
          text = setup.read_text()
          text = text.replace(
              "_cmake_extra_options = []",
              "_cmake_extra_options = ['-DDLIB_NO_GUI_SUPPORT=ON']",
          )
          setup.write_text(text)

          config = Path("pyproject.toml")
          text = config.read_text()
          text = text.replace(
              'requires = ["setuptools", "wheel"]',
              'requires = ["setuptools", "wheel", "cmake>=3.31.0"]',
          )
          config.write_text(text)
          PY

      - name: Build wheels
        uses: pypa/cibuildwheel@v4.2.1
        with:
          package-dir: dlib
        env:
          CIBW_BUILD: cp3*-${{ matrix.platform }}
          CIBW_ARCHS: ${{ matrix.arch }}
          CIBW_PROJECT_REQUIRES_PYTHON: ">=3.10"
          CIBW_SKIP: "cp3*t-*"
          CIBW_TEST_SKIP: "*-win_arm64"

          CIBW_BEFORE_BUILD: pip install cmake

          CIBW_TEST_COMMAND: >-
            python -c "import dlib;
            from importlib.metadata import version;
            assert dlib.__version__ == version('dlib')"

          MACOSX_DEPLOYMENT_TARGET: "14.0"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.platform }}
          path: wheelhouse/*.whl
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish Release
    needs: build
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Download wheels
        uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true

      - name: Verify artifacts
        shell: bash
        run: |
          shopt -s nullglob
          wheels=(dist/*.whl)
          if (( ${#wheels[@]} == 0 )); then
            echo "No wheels found"
            exit 1
          fi

          cd dist
          sha256sum *.whl > SHA256SUMS.txt

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          TAG="wheels-${DLIB_VERSION}"

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists"
            exit 1
          fi

          gh release create "$TAG" dist/* \
            --title "dlib ${DLIB_VERSION#v} Wheels" \
            --notes "Unofficial precompiled dlib wheels built from the official source. Includes SHA256 checksums." \
            --latest=false
